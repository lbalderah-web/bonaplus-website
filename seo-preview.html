<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión SEO Bonaplus</title><style>body{margin:0;background:#e7e9ee;font:14px Arial;color:#122d43}header{padding:12px}nav{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px}a{color:#0754c8}iframe{display:block;border:1px solid #ccd1da;height:900px;background:white}pre{white-space:pre-wrap}</style></head><body><header><nav id="pages"></nav><nav id="sizes"></nav><pre id="result">Cargando revisión…</pre></header><iframe id="preview" title="Vista de la página"></iframe><script>
const params=new URLSearchParams(location.search),paths=['/mayoristas/','/productos/cloro/','/productos/rinse/','/productos-limpieza/','/'],sizes=[320,390,768,1280];
const path=paths.includes(params.get('page'))?params.get('page'):'/mayoristas/',width=sizes.includes(Number(params.get('width')))?Number(params.get('width')):390;
document.getElementById('pages').innerHTML=paths.map(p=>`<a href="?page=${encodeURIComponent(p)}&width=${width}">${p}</a>`).join('');
document.getElementById('sizes').innerHTML=sizes.map(w=>`<a href="?page=${encodeURIComponent(path)}&width=${w}">${w}px</a>`).join('');
const frame=document.getElementById('preview');frame.style.width=width+'px';
frame.addEventListener('load',async()=>{const d=frame.contentDocument;if(!d?.querySelector('main'))return;await d.fonts.ready;await Promise.all(Array.from(d.images).filter(i=>i.loading!=='lazy').map(i=>i.decode().catch(()=>{})));const r={path,width,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,h1:d.querySelector('h1')?.innerText,breadcrumb:d.querySelector('.breadcrumbs')?.innerText,tableRows:d.querySelectorAll('.wholesale-catalog tbody tr').length,presentations:d.querySelectorAll('.presentation-links a').length,brokenLoadedImages:Array.from(d.images).filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.getAttribute('src'))};document.getElementById('result').textContent=JSON.stringify(r);});
fetch(path).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(html=>{frame.srcdoc=html.replace('<head>','<head><base href="'+location.origin+path+'">')}).catch(e=>document.getElementById('result').textContent=e.message);
</script></body></html>
