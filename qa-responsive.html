<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Revisión visual temporal</title><style>body{margin:0;font:14px Arial;background:#d9e1e7;color:#122d43}header{padding:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#fff;z-index:2}select,button{font:inherit;padding:9px;border:1px solid #a0aabb;border-radius:5px;background:#fff}button[aria-pressed=true]{background:#0754c8;color:#fff}iframe{display:block;box-sizing:content-box;margin:20px auto;border:1px solid #adbac4;background:#fff;height:850px}#state{font-size:12px}</style></head><body><header><label>Página <select id="page"><option value="/">Inicio</option><option value="/empresa/">Empresa</option><option value="/mayoristas/">Mayoristas</option><option value="/guia-mayoristas/">Guía</option><option value="/productos-limpieza/">Limpieza</option><option value="/productos-cuidado-personal/">Cuidado personal</option><option value="/productos/cloro/">Cloro</option><option value="/productos/vinagre/">Vinagre</option><option value="/productos/lavaplatos/">Lavaplatos</option><option value="/productos/vainilla/">Vainilla</option><option value="/productos/calzado/">Calzado</option><option value="/productos/desinfectante/">Desinfectante</option><option value="/productos/rinse/">Rinse</option><option value="/productos/shampoo/">Shampoo</option></select></label><button data-width="320">320 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button><span id="state" role="status"></span></header><iframe title="Vista de la página" width="390"></iframe><script>
const frame=document.querySelector('iframe'),select=document.getElementById('page'),state=document.getElementById('state');
async function load(){state.textContent='Cargando';const page=select.value;let html=await (await fetch(page)).text();html=html.replace('<head>','<head><base href="'+new URL(page,location.href).href+'">');frame.srcdoc=html;frame.onload=()=>{state.textContent='Vista lista: '+page;};}
select.addEventListener('change',load);document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.width=button.dataset.width;document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));load();
</script></body></html>
