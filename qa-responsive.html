    &lt;section id=&quot;como-comprar&quot; class=&quot;steps section-shell section-padding&quot;&gt;
      &lt;div class=&quot;section-heading reveal&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;De tu selección a tu negocio&lt;/p&gt;&lt;h2&gt;Tu próximo pedido,&lt;br&gt;en tres pasos.&lt;/h2&gt;&lt;/div&gt;
      &lt;div class=&quot;step-grid&quot;&gt;
        &lt;article class=&quot;reveal&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;h3&gt;Elige tus productos&lt;/h3&gt;&lt;p&gt;Selecciona las presentaciones y escribe la cantidad de cajas que necesitas.&lt;/p&gt;&lt;/article&gt;
        &lt;article class=&quot;reveal&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;h3&gt;Solicita tu cotización&lt;/h3&gt;&lt;p&gt;Completa tus datos y envíanos tu selección por WhatsApp.&lt;/p&gt;&lt;/article&gt;
        &lt;article class=&quot;reveal&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;h3&gt;Coordinamos contigo&lt;/h3&gt;&lt;p&gt;Confirmamos precios, disponibilidad, transporte y fecha de entrega.&lt;/p&gt;&lt;/article&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;faq section-shell section-padding&quot; aria-labelledby=&quot;faqTitle&quot;&gt;
      &lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;Resolvemos tus dudas&lt;/p&gt;&lt;h2 id=&quot;faqTitle&quot;&gt;Todo claro.&lt;br&gt;Desde el principio.&lt;/h2&gt;&lt;a class=&quot;text-link&quot; href=&quot;/guia-mayoristas/&quot;&gt;Ver la guía de compra &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;
      &lt;div class=&quot;faq-list&quot;&gt;
        &lt;details&gt;&lt;summary&gt;¿Cómo solicito una cotización?&lt;/summary&gt;&lt;p&gt;Elige los productos del catálogo, indica la cantidad de cajas y pulsa Continuar. Podrás revisar tu selección y preparar un mensaje de WhatsApp para nuestro equipo.&lt;/p&gt;&lt;/details&gt;
        &lt;details&gt;&lt;summary&gt;¿Cuántas cajas puedo pedir?&lt;/summary&gt;&lt;p&gt;Los pedidos habituales son de aproximadamente 400 cajas o más. Es una referencia, no un mínimo fijo: nuestro equipo confirma las condiciones de cada solicitud.&lt;/p&gt;&lt;/details&gt;
        &lt;details&gt;&lt;summary&gt;¿Hacen entregas fuera de Santo Domingo?&lt;/summary&gt;&lt;p&gt;Sí, tenemos distribución en toda la República Dominicana. Coordinamos contigo disponibilidad, transporte y fecha de entrega.&lt;/p&gt;&lt;/details&gt;
        &lt;details&gt;&lt;summary&gt;¿Dónde consulto los precios?&lt;/summary&gt;&lt;p&gt;Preparamos tu cotización directamente por WhatsApp según los productos, el volumen y el destino del pedido. Atendemos de lunes a viernes, de 8:00 a.m. a 6:00 p.m.&lt;/p&gt;&lt;/details&gt;
      &lt;/div&gt;
    &lt;/section&gt;
    &lt;section class=&quot;cta section-shell reveal&quot;&gt;
      &lt;div&gt;&lt;p class=&quot;eyebrow&quot;&gt;Haz crecer tu distribución&lt;/p&gt;&lt;h2&gt;Conversemos sobre tu próximo pedido.&lt;/h2&gt;&lt;p&gt;Un asesor te ayudará a coordinar cada detalle de tu compra al por mayor.&lt;/p&gt;&lt;/div&gt;
      &lt;a class=&quot;button button-light&quot; href=&quot;https://wa.me/18093791396?text=Hola%20Bonaplus,%20quiero%20informaci%C3%B3n%20para%20hacer%20un%20pedido%20al%20por%20mayor.&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Escribir por WhatsApp&lt;/a&gt;
